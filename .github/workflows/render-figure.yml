name: Render authors' Figure 1 preview

on:
  push:
    branches: [main]
    paths:
      - figures/data/figure_1/figure1_authors.pdf
      - scripts/render_public_figure.py
      - .github/workflows/render-figure.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic PDF renderer
        run: python -m pip install "PyMuPDF==1.28.2"
      - name: Convert original PDF into a GitHub-friendly preview
        run: python scripts/render_public_figure.py
      - name: Commit rendered preview if changed
        run: |
          git add assets/repert_figure1.png
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "docs: render authors' Figure 1 for public pages"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
